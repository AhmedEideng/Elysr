<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>غير متصل بالإنترنت — اليسر ميديكال</title>
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#0085ca" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          "Cairo",
          "Segoe UI",
          sans-serif;
        background: linear-gradient(180deg, #f0f9ff 0%, #ffffff 100%);
        color: #0a4f7a;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        direction: rtl;
      }
      .card {
        max-width: 480px;
        background: white;
        border-radius: 24px;
        padding: 40px 32px;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0, 133, 202, 0.08);
        border: 1px solid rgba(0, 133, 202, 0.12);
      }
      .icon {
        font-size: 64px;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 24px;
        font-weight: 800;
        margin-bottom: 12px;
        color: #0a4f7a;
      }
      p {
        font-size: 15px;
        line-height: 1.7;
        color: #475569;
        margin-bottom: 24px;
      }
      .btn {
        display: inline-block;
        background: linear-gradient(135deg, #0085ca 0%, #0a4f7a 100%);
        color: white;
        padding: 14px 28px;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 700;
        font-size: 15px;
        border: none;
        cursor: pointer;
        box-shadow: 0 8px 24px rgba(0, 133, 202, 0.25);
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }
      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 28px rgba(0, 133, 202, 0.35);
      }
      .links {
        margin-top: 24px;
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }
      .links a {
        color: #0085ca;
        text-decoration: none;
        font-size: 14px;
        padding: 6px 12px;
        border-radius: 8px;
      }
      .links a:hover {
        background: #f0f9ff;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon" aria-hidden="true">📡</div>
      <h1>غير متصل بالإنترنت</h1>
      <p>
        يبدو أنك فقدت الاتصال بالإنترنت. لا تقلق — يمكنك متابعة تصفح المنتجات التي زرتها سابقاً.
        تحقق من الاتصال ثم حاول مرة أخرى.
      </p>
      <button class="btn" onclick="window.location.reload()">🔄 إعادة المحاولة</button>
      <div class="links">
        <a href="/products/men">منتجات الرجال</a>
        <a href="/products/women">منتجات النساء</a>
        <a href="/education">مقالات</a>
      </div>
    </div>
  </body>
</html>
