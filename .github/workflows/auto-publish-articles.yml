name: 💎 Auto Publish Weekly Medical Article

on:
  schedule:
    # Every Monday at 09:00 UTC (11:00 Cairo — Egypt is permanently UTC+2 since 2023, no DST).
    - cron: "0 9 * * 1"
  workflow_dispatch:

# Publishing is automatic after the full technical validation pipeline passes.
permissions:
  contents: write

concurrency:
  group: weekly-medical-article
  cancel-in-progress: false

jobs:
  publish-article:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: 📦 Install locked dependencies
        run: npm ci --no-audit --prefer-offline

      - name: 🤖 Generate medical article
        run: node scripts/auto-generate-article.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: 🔗 Validate live trusted sources and claim support
        run: npm run test:sources
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: 🧹 Format generated files
        run: npm run format

      - name: ✅ Run full technical validation
        run: npm run ci
        env:
          SITE_URL: https://elysrmedical.store

      - name: 🚀 Commit and publish to main
        run: |
          git config user.name "Elysr Medical Automation"
          git config user.email "automation@elysrmedical.store"
          git add .

          if git diff --cached --quiet; then
            echo "No article changes were generated."
            exit 0
          fi

          git commit -m "content: publish weekly medical article"
          # Rebase on any main updates that landed while validation was running.
          git pull --rebase origin main
          git push origin HEAD:main
