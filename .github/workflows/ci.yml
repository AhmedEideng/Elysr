name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel previous runs on the same branch to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  # ─────────────────────────────────────────────────────────
  # 1) Static analysis — fast feedback before expensive jobs
  # ─────────────────────────────────────────────────────────
  static:
    name: 🔍 Lint • Typecheck • Data Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # needed by schema validator + sitemap git log

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --prefer-offline

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Data integrity tests
        run: npm test

  # ─────────────────────────────────────────────────────────
  # 2) Build — generates prerendered HTML, sitemaps, feeds
  # ─────────────────────────────────────────────────────────
  build:
    name: 🏗 Build • Prerender • Sitemaps
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --prefer-offline

      - name: Build
        env:
          SITE_URL: https://elysrmedical.store
        run: npm run build

      # 🔍 Validate JSON-LD schemas AFTER build (requires the generated dist/)
      - name: Validate JSON-LD schemas
        run: node scripts/validate-schemas.mjs

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist
          retention-days: 7
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────
  # 3) Lighthouse — runs against the prerendered home page
  # ─────────────────────────────────────────────────────────
  lighthouse:
    name: 🚦 Lighthouse Performance Budget
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --prefer-offline

      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist

      # 🚀 Serve dist/ via the real server (handles clean URLs like /products/men -> men.html)
      - name: Serve dist/ (server/index.js)
        run: |
          PORT=8080 node server/index.js > /tmp/server.log 2>&1 &
          # wait for server to be ready (check root returns 200)
          for i in $(seq 1 15); do
            if curl -sf -o /dev/null http://localhost:8080/; then break; fi
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:8080/products/men && echo "Server OK (clean URLs work)"

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: .lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false

      - name: Fail build on budget errors
        run: |
          if [ -f "lighthouse-reports/lighthouse-summary.json" ]; then
            node -e '
              const s = require("./lighthouse-reports/lighthouse-summary.json");
              if (s.failures && s.failures.length > 0) {
                console.error("❌ Lighthouse budget failures:", s.failures);
                process.exit(1);
              }
              console.log("✅ Lighthouse budgets passed");
            '
          fi

  # ─────────────────────────────────────────────────────────
  # 4) Browser checkout flow + real HTTP 404 behaviour
  # ─────────────────────────────────────────────────────────
  e2e:
    name: 🧪 Browser Checkout Flow
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --prefer-offline

      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e
