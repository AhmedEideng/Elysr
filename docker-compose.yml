# Elysr Medical — self-hosted web service
# Usage: docker compose up -d

services:
  web:
    build: .
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=8080
    restart: unless-stopped
    healthcheck:
      test: wget -qO- http://localhost:8080/health || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
