# ============================================================
# Elysr Medical — docker-compose.yml
# ============================================================
# Full stack: SSR server + Redis (rate limiting)
#
# Usage:
#   docker compose up -d
#   docker compose logs -f web
#
# Environment: copy .env.example → .env and fill in values.
# Redis will auto-connect when REDIS_URL is set.
# ============================================================

services:
  web:
    build: .
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - PORT=8080
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: wget -qO- http://localhost:8080/health || exit 1
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: redis-cli ping
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
